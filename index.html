<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>메카넘휠 Web BLE 제어기</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { margin: 10px 0 5px 0; color: #1f2937; }
    #status { margin-bottom: 12px; font-size: 14px; color: #4b5563; font-weight: bold; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .action-btn {
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-connect { background-color: #2563eb; }
    .btn-disconnect { background-color: #ef4444; display: none; }
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      touch-action: manipulation;
    }
    .btn:active { background-color: #1d4ed8; transform: scale(0.95); }
    .stop-box { background-color: #e5e7eb; color: #9ca3af; font-size: 14px; box-shadow: none; cursor: default; }
    .rotate-group { display: flex; gap: 15px; margin-bottom: 20px; }
    .rotate-btn { width: 125px; height: 55px; font-size: 16px; background-color: #6366f1; }
    .log-box {
      width: 270px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      color: #374151;
      height: 60px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h2>메카넘휠 제어기</h2>
  <div id="status">상태: 블루투스 연결 대기 중</div>

  <div class="btn-group">
    <button id="btnConnect" class="action-btn btn-connect" onclick="connectBLE()">BLE 기기 연결</button>
    <button id="btnDisconnect" class="action-btn btn-disconnect" onclick="disconnectBLE()">연결 해제</button>
  </div>

  <!-- 8방향 패드 -->
  <div class="pad-grid">
    <button class="btn" data-cmd="Q">↖</button>
    <button class="btn" data-cmd="F">▲</button>
    <button class="btn" data-cmd="E">↗</button>
    <button class="btn" data-cmd="L">◀</button>
    <div class="btn stop-box">STOP</div>
    <button class="btn" data-cmd="R">▶</button>
    <button class="btn" data-cmd="Z">↙</button>
    <button class="btn" data-cmd="B">▼</button>
    <button class="btn" data-cmd="C">↘</button>
  </div>

  <!-- 제자리 회전 -->
  <div class="rotate-group">
    <button class="btn rotate-btn" data-cmd="J">↺ 좌회전</button>
    <button class="btn rotate-btn" data-cmd="K">우회전 ↻</button>
  </div>

  <!-- 디버깅 로그 창 -->
  <div id="logBox" class="log-box">로그: 대기 중...</div>

  <script>
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleCharacteristic = null;

    const statusDiv = document.getElementById('status');
    const connectBtn = document.getElementById('btnConnect');
    const disconnectBtn = document.getElementById('btnDisconnect');
    const logBox = document.getElementById('logBox');

    function log(msg) {
      logBox.innerText = `[${new Date().toLocaleTimeString()}] ` + msg;
    }

    // 1. BLE 장치 검색 및 연결
    async function connectBLE() {
      try {
        statusDiv.innerText = "상태: 기기 검색 중...";
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        // 기기가 비정상 종료되었을 때 자동 감지
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        statusDiv.innerText = `상태: ${bleDevice.name || '장치'} 연결 중...`;
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        statusDiv.innerText = `상태: 연결됨 (${bleDevice.name || 'HC-06 LE'})`;
        statusDiv.style.color = "#16a34a";
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "inline-block";
        log("연결 완료!");
      } catch (error) {
        statusDiv.innerText = "상태: 연결 실패";
        statusDiv.style.color = "#dc2626";
        log("연결 오류: " + error.message);
      }
    }

    // 2. BLE 연결 해제 함수
    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        onDisconnected();
      }
    }

    // 연결 끊김 발생 시 UI 복원
    function onDisconnected() {
      statusDiv.innerText = "상태: 연결 해제됨";
      statusDiv.style.color = "#4b5563";
      connectBtn.style.display = "inline-block";
      disconnectBtn.style.display = "none";
      bleCharacteristic = null;
      log("장치 연결이 해제되었습니다.");
    }

    // 3. 데이터 전송 함수 (WithoutResponse 실패 시 WriteWithResponse 자동 폴백)
    async function sendCommand(cmd) {
      if (!bleCharacteristic) {
        log("전송 불가: 기기 미연결");
        return;
      }
      try {
        // 아두이노 수신 형식에 맞춰 필요 시 개행 추가 (예: cmd + '\n')
        const encoder = new TextEncoder();
        const data = encoder.encode(cmd);

        if (bleCharacteristic.properties.writeWithoutResponse) {
          await bleCharacteristic.writeValueWithoutResponse(data);
        } else {
          await bleCharacteristic.writeValue(data);
        }
        log(`전송 성공: '${cmd}'`);
      } catch (err) {
        log(`전송 실패: ${err.message}`);
      }
    }

    // 버튼 이벤트 바인딩
    document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
      const cmd = btn.getAttribute('data-cmd');
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sendCommand(cmd);
      });
      btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        sendCommand('S');
      });
      btn.addEventListener('pointerleave', (e) => {
        e.preventDefault();
        sendCommand('S');
      });
    });
  </script>
</body>
</html>
